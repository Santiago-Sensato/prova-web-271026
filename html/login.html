<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
</head>
<body class="">
    <div class="container min-vh-100 d-flex align-itens-center justify-content-center">

        <div class="row w-100 justify-content-center">
 
                <div class="col-12 col-md-8 col-lg-5 col-xl-4">

                     <div class="card-border-0 shadow-lg rounded-4">

                             <div class="card-body p-4 p-md-5">

                              <div class="text-center mb-4">

                            <h2 class="fw-bold">BEM VINDO(a)</h2>
                            <p class="text-secondary">Entre com sua conta</p>
                            </div>

                            <form>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        E-mail:
                                    </label>
                                    <input type="email" class="form-control form-control-lg"
                                    placeholder="example@email">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        Senha:
                                    </label>

                                    <input type="password" class="form-control form-control-lg"
                                    placeholder="digite sua senha">

                                    <div class="form-check mb-4">
                                        <input type="checkbox"
                                        class="form-check-input"
                                        id="lembrar">

                                        <label for="lembrar" class="form-check-label">
                                            LEMBRAR
                                        </label>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-lg w-100">
                                         Entrar
                                   </button>
                                </div>

                                
                            


                            </form>
                            <a href="./signin.html" class="text-center mb-4">não tenho uma conta</a>
                            

                        </div>
                        
                    </div>
                </div>

        </div>
    </div>


    





    <script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
